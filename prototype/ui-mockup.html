<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>桌面图标布局备份管理 · UI 样板</title>
<style>
  :root{
    color-scheme:light;
    --page-bg:#E8EDF4;
    --app-bg:#E8EBF0;
    --chrome:#F8F9FB;
    --surface:#FFFFFF;
    --surface-2:#F3F5F8;
    --surface-3:#E5E9EF;
    --ink:#18202B;
    --ink-2:#48525F;
    --ink-3:#616B79;
    --line:#D5DBE4;
    --line-strong:#BFC8D4;
    --brand:#1A5FBF;
    --brand-hover:#144C9C;
    --brand-soft:#E6EFFC;
    --brand-ink:#0D3A73;
    --brand-soft-border:#C9DAF2;
    --on-brand:#FFFFFF;
    --on-brand-soft:rgba(255,255,255,.35);
    --ok:#147A43;
    --ok-bg:#147A43;
    --ok-border:#0E6337;
    --danger:#B3261E;
    --danger-text:#B3261E;
    --chip-bg:rgba(251,252,254,.86);
    --fade-1:rgba(255,255,255,.96);
    --fade-2:rgba(255,255,255,.74);
    --mini-dot:rgba(27,28,26,.06);
    --desktop-bg:#E9EEF5;
    --desktop-dot:rgba(27,28,26,.1);
    --desktop-label:#2C3542;
    --desktop-label-shadow:rgba(255,255,255,.65);
    --scrollbar:#BCC6D4;
    --focus-halo:rgba(26,95,191,.14);
    --fs-aux:14px;
    --fs-body:16px;
    --fs-title:18px;
    --fs-display:22px;
    --fs-preview-label:12px;
    --fs-icon:11px;
    --lh-aux:1.5;
    --lh-body:1.45;
    --lh-title:1.35;
    --lh-display:1.25;
    --radius:10px;
    --font-display:"Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
    --font-text:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
    --font-mono:"Cascadia Mono","Cascadia Code",Consolas,monospace;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --page-bg:#0B0B0D;
    --app-bg:#0C0C0E;
    --chrome:#141416;
    --surface:#1A1A1C;
    --surface-2:#232326;
    --surface-3:#2E2E32;
    --ink:#F3EFE4;
    --ink-2:#CFC8B8;
    --ink-3:#A39C8B;
    --line:#33332E;
    --line-strong:#48483F;
    --brand:#E8B53A;
    --brand-hover:#F2C55A;
    --brand-soft:#3A2F10;
    --brand-ink:#F5E3A8;
    --brand-soft-border:#6B5518;
    --on-brand:#1A1305;
    --on-brand-soft:rgba(26,19,5,.35);
    --ok:#5BD08E;
    --ok-bg:#147A43;
    --ok-border:#0E6337;
    --danger:#B3261E;
    --danger-text:#FF8F8A;
    --chip-bg:rgba(26,26,28,.86);
    --fade-1:rgba(26,26,28,.96);
    --fade-2:rgba(26,26,28,.72);
    --mini-dot:rgba(240,235,220,.08);
    --desktop-bg:#18181B;
    --desktop-dot:rgba(240,235,220,.12);
    --desktop-label:#E9E4D6;
    --desktop-label-shadow:rgba(0,0,0,.55);
    --scrollbar:#3A3A3E;
    --focus-halo:rgba(232,181,58,.18);
  }
  :root[data-font-size="small"]{
    --fs-aux:12px;
    --fs-body:14px;
    --fs-title:16px;
    --fs-display:20px;
  }
  :root[data-font-size="large"]{
    --fs-aux:16px;
    --fs-body:18px;
    --fs-title:20px;
    --fs-display:24px;
  }
  :root[data-font-size="xlarge"]{
    --fs-aux:18px;
    --fs-body:20px;
    --fs-title:22px;
    --fs-display:26px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:24px;
    background:var(--page-bg);
    color:var(--ink);
    font-family:var(--font-text);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}

  .app{
    width:min(1180px,96vw);
    height:min(820px,90vh);
    display:flex;flex-direction:column;
    background:var(--chrome);
    border:1px solid var(--line-strong);
    border-radius:14px;
    box-shadow:0 32px 90px rgba(28,28,24,.24),0 2px 6px rgba(28,28,24,.12);
    overflow:hidden;
  }

  /* ---------- 标题栏 ---------- */
  .titlebar{
    flex:none;height:44px;display:flex;align-items:center;gap:10px;
    padding-left:14px;border-bottom:1px solid var(--line);background:var(--chrome);
    user-select:none;
  }
  .mark{
    width:20px;height:20px;border-radius:6px;background:var(--brand-soft);
    border:1px solid var(--brand-soft-border);padding:4px;
    display:grid;grid-template-columns:1fr 1fr;gap:2px;
  }
  .mark i{display:block;border-radius:2px;background:var(--brand)}
  .mark i:nth-child(2),.mark i:nth-child(3){background:color-mix(in srgb, var(--brand) 55%, var(--surface))}
  .app-title{font:600 var(--fs-title)/var(--lh-title) var(--font-display);letter-spacing:.01em}
  .app-sub{font:400 var(--fs-aux)/1.2 var(--font-mono);color:var(--ink-3);letter-spacing:.12em;text-transform:uppercase;margin-left:2px}
  .titlebar-actions{margin-left:auto;display:flex;align-items:center;padding-right:8px}
  .win-controls{display:flex;height:100%}
  .win-controls button{
    width:46px;height:100%;border:0;background:transparent;color:var(--ink-2);
    display:grid;place-items:center;cursor:default;
  }
  .win-controls button:hover{background:var(--surface-3)}
  .win-controls button.close:hover{background:var(--danger);color:#fff}
  .win-controls svg{width:10px;height:10px;stroke:currentColor;stroke-width:1.4;fill:none}

  /* ---------- 工具栏 ---------- */
  .toolbar{
    flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    flex-wrap:wrap;
    padding:20px 22px 16px;border-bottom:1px solid var(--line);
  }
  .h-row{display:flex;align-items:center;gap:9px}
  h1{margin:0;font:600 var(--fs-display)/var(--lh-display) var(--font-display);letter-spacing:-.015em}
  .count{font:500 var(--fs-aux)/1 var(--font-mono);background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);border-radius:5px;padding:3px 6px}
  .sub{margin:8px 0 0;font:400 var(--fs-aux)/var(--lh-aux) var(--font-text);color:var(--ink-2)}
  .sub b{font-weight:600;color:var(--ink);font-family:var(--font-mono);letter-spacing:.01em}
  .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

  .btn-primary{
    height:36px;padding:0 14px 0 12px;display:inline-flex;align-items:center;gap:7px;
    border:1px solid var(--brand-hover);border-radius:8px;background:var(--brand);color:var(--on-brand);
    font:500 var(--fs-body)/1 var(--font-text);cursor:pointer;
    box-shadow:0 1px 2px rgba(0,0,0,.14);
    transition:background .15s,transform .12s;
  }
  .btn-primary:hover{background:var(--brand-hover)}
  .btn-primary:active{transform:translateY(1px)}
  .btn-primary:focus-visible{outline:2px solid var(--on-brand);outline-offset:-4px;box-shadow:0 0 0 3px var(--brand-hover)}
  .btn-primary:disabled{opacity:.78;cursor:default}
  #pvUse:disabled{opacity:1;background:var(--ok-bg);border-color:var(--ok-border);color:#fff;cursor:default}
  .btn-primary svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.5;fill:none}
  .btn-primary .spinner{display:none;width:13px;height:13px;border-radius:50%;border:2px solid var(--on-brand-soft);border-top-color:var(--on-brand);animation:spin .7s linear infinite}
  .btn-primary.loading .spinner{display:block}
  .btn-primary.loading svg{display:none}
  .btn-sm{height:32px;padding:0 12px}
  @keyframes spin{to{transform:rotate(360deg)}}

  .seg{
    display:inline-flex;align-items:center;height:36px;padding:2px;
    background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;
  }
  .seg button{
    display:inline-flex;align-items:center;justify-content:center;gap:4px;
    height:30px;min-width:56px;padding:0 12px;border:0;border-radius:0;
    background:none;color:var(--ink-2);
    font:500 var(--fs-body)/1 var(--font-text);cursor:pointer;
    transition:background .2s ease,color .2s ease,box-shadow .2s ease;
  }
  .seg button:first-child{border-radius:8px 0 0 8px}
  .seg button:last-child{border-radius:0 8px 8px 0}
  .seg button:hover{box-shadow:inset 0 0 0 1px var(--brand);color:var(--brand-ink)}
  .seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);box-shadow:none}
  .seg button[aria-pressed="true"]:hover{box-shadow:none;color:var(--on-brand)}
  .seg button[aria-pressed="true"]:focus-visible{outline:2px solid var(--on-brand);outline-offset:-4px}
  .seg svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.5;fill:none}

  /* ---------- 排序胶囊组合控件 ---------- */
  .pill-group{display:inline-flex;align-items:stretch;height:36px;--r:8px;background:var(--surface)}
  .pill-group > *{
    display:flex;align-items:center;height:100%;position:relative;
    font:500 var(--fs-body)/1 var(--font-text);color:var(--ink);
    background:var(--surface);border:1px solid var(--brand);
  }
  .pill-group > * + *{margin-left:-1px}
  .pill-group > *:first-child{border-radius:var(--r) 0 0 var(--r)}
  .pill-group > *:last-child{border-radius:0 var(--r) var(--r) 0}
  .group-label{padding:0 14px;color:var(--ink-2);white-space:nowrap}
  .dd-trigger{
    gap:6px;padding:0 14px;border-radius:0;background:transparent;
    cursor:pointer;transition:background .12s ease;
  }
  .dd-trigger:hover{background:var(--brand-soft)}
  .dd-trigger .dd-value,.dd-trigger .arrow{transition:color .12s ease,transform .18s ease}
  .dd-trigger:hover .dd-value,.dd-trigger:hover .arrow,
  .dd-trigger:focus-visible .dd-value,.dd-trigger:focus-visible .arrow,
  .dd-trigger[aria-expanded="true"] .dd-value,.dd-trigger[aria-expanded="true"] .arrow{color:var(--brand)}
  .dd-trigger[aria-expanded="true"] .arrow{transform:rotate(180deg)}
  .dd-trigger svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.5;fill:none}
  .dir-btn{
    justify-content:center;width:34px;padding:0;border-color:var(--brand);
    background:var(--brand);color:var(--on-brand);cursor:pointer;transition:background .12s ease;
  }
  .dir-btn:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
  .dir-btn:focus-visible{outline:2px solid var(--on-brand);outline-offset:-4px;box-shadow:0 0 0 2px var(--brand-hover)}
  .dir-btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}

  .dd-mask{position:fixed;inset:0;z-index:90}
  .dd-menu{
    position:fixed;z-index:100;min-width:168px;padding:4px;
    background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;
    box-shadow:0 12px 32px rgba(24,32,43,.18);
  }
  .dd-item{
    display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
    min-height:32px;padding:8px 12px;border:0;border-radius:8px;background:transparent;
    color:var(--ink);font:500 var(--fs-body)/1.35 var(--font-text);text-align:left;cursor:pointer;
  }
  .dd-item:hover{background:var(--brand);color:var(--on-brand)}
  .dd-item.selected{background:var(--brand-soft);color:var(--brand-ink);font-weight:500}
  .dd-item .tick{font:500 var(--fs-aux)/1 var(--font-text);opacity:0}
  .dd-item.selected .tick{opacity:1}
  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
  }

  /* ---------- 内容区 ---------- */
  .content{flex:1;min-height:0;overflow:auto;padding:20px 22px 26px;background:var(--app-bg)}
  .content.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:16px;align-content:start}
  .content.list{display:block}
  .content::-webkit-scrollbar{width:10px}
  .content::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:8px;border:3px solid var(--app-bg)}

  /* ---------- 卡片 ---------- */
  .card{
    border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
    overflow:hidden;cursor:default;
    box-shadow:0 1px 2px rgba(24,32,43,.06);
    transition:transform .16s ease,box-shadow .16s ease,border-color .16s;
  }
  .card:hover{transform:translateY(-2px);border-color:var(--line-strong);box-shadow:0 10px 24px rgba(30,38,50,.12)}
  .thumb{position:relative;aspect-ratio:16/9;background:var(--surface-2);border-bottom:1px solid var(--line);overflow:hidden}
  .mini{
    position:absolute;inset:0;
    background-image:radial-gradient(var(--mini-dot) 1px,transparent 1px);
    background-size:14px 14px;
  }
  .mini .di{position:absolute;width:5px;height:5px;border-radius:1.5px}
  .badge{
    position:absolute;top:8px;left:8px;z-index:2;
    font:500 var(--fs-aux)/1 var(--font-text);padding:4px 7px;border-radius:5px;
    background:var(--ok-bg);color:#fff;border:1px solid var(--ok-border);
    box-shadow:0 1px 3px rgba(15,60,35,.18);
  }
  .res{
    position:absolute;top:8px;right:8px;z-index:2;
    font:400 var(--fs-aux)/1 var(--font-mono);letter-spacing:.02em;padding:4px 6px;border-radius:5px;
    background:var(--chip-bg);border:1px solid var(--line);color:var(--ink-2);
    backdrop-filter:blur(2px);
  }
  .thumb-actions{
    position:absolute;left:0;right:0;bottom:0;z-index:3;
    display:flex;justify-content:center;gap:8px;
    padding:22px 10px 10px;
    background:linear-gradient(to top,var(--fade-1) 0%,var(--fade-2) 58%,transparent 100%);
    opacity:0;transform:translateY(6px);pointer-events:none;
    transition:opacity .16s,transform .16s;
  }
  .card:hover .thumb-actions,.card:focus-within .thumb-actions{opacity:1;transform:none;pointer-events:auto}
  .tbtn{
    min-height:28px;padding:6px 12px;border:1px solid var(--line-strong);border-radius:8px;
    background:var(--surface);color:var(--brand);
    font:500 var(--fs-body)/1 var(--font-text);cursor:pointer;white-space:nowrap;
    box-shadow:0 2px 6px rgba(24,32,43,.08);
    transition:background .14s,color .14s,border-color .14s,box-shadow .14s;
  }
  .tbtn:hover{background:var(--brand);border-color:var(--brand);color:var(--on-brand);box-shadow:0 3px 10px rgba(0,0,0,.18)}
  .tbtn.use{background:var(--brand-soft);border-color:var(--brand-soft-border);color:var(--brand-ink)}
  .tbtn.use:hover{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
  .tbtn.use.is-current,.tbtn.use.is-current:hover{
    background:var(--ok-bg);border-color:var(--ok-border);color:#fff;cursor:default;
    box-shadow:0 2px 6px rgba(15,60,35,.18);
  }
  .card-body{padding:11px 13px 13px}
  .name-row{display:flex;align-items:center;gap:4px}
  .name{
    margin:0;flex:1;min-width:0;
    font:600 var(--fs-title)/var(--lh-title) var(--font-display);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .meta{margin:6px 0 0;display:flex;align-items:center;gap:6px;font:400 var(--fs-aux)/1.3 var(--font-mono);color:var(--ink-3);letter-spacing:.01em}
  .meta .sep{color:var(--line-strong);font-style:normal}

  .icon-btn{
    flex:none;width:28px;height:28px;border:1px solid var(--ink);border-radius:8px;
    background:var(--surface);color:var(--ink);
    display:grid;place-items:center;cursor:pointer;
    transition:background .15s,border-color .15s,color .15s;
  }
  .icon-btn svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.4;fill:none}
  #settingsBtn{border:0;background:transparent;color:var(--ink-2);border-radius:8px}
  #settingsBtn:hover{background:var(--brand);color:var(--on-brand)}
  #settingsBtn svg{width:15px;height:15px;stroke-width:1.5}
  .icon-btn:hover{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
  .icon-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

  /* ---------- 列表 ---------- */
  .list-head,.row{
    display:grid;grid-template-columns:96px minmax(160px,1fr) 120px 140px 70px calc(var(--fs-body) * 9 + 52px);
    align-items:center;gap:12px;padding:0 10px;
  }
  .list-head{
    height:34px;font:500 var(--fs-aux)/1.2 var(--font-text);color:var(--ink-2);
    border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;
    background:var(--surface);position:sticky;top:0;z-index:1;
  }
  .row{
    height:64px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);border-right:1px solid var(--line);
    background:var(--surface);cursor:default;transition:background .12s;
  }
  .row:last-child{border-radius:0 0 10px 10px}
  .row:hover{background:var(--surface-2)}
  .mini-wrap{width:96px;height:54px;border:1px solid var(--line);border-radius:7px;overflow:hidden;position:relative;background:var(--surface-2)}
  .row .mini .di{width:2.5px;height:2.5px;border-radius:1px}
  .cell-name{display:flex;align-items:center;gap:4px;min-width:0}
  .cell-time,.cell-res{font:400 var(--fs-aux)/1.3 var(--font-mono);color:var(--ink-2)}
  .cell-count{font:400 var(--fs-aux)/1.3 var(--font-mono);color:var(--ink-3)}
  .list-head span:last-child{text-align:right}
  .row-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px}
  .row-open,.row-use{
    min-height:28px;padding:6px 9px;border-radius:8px;border:1px solid var(--line-strong);
    font:500 var(--fs-body)/1 var(--font-text);cursor:pointer;white-space:nowrap;
    transition:background .15s,color .15s,border-color .15s;
  }
  .row-open{background:transparent;color:var(--ink-2)}
  .row-open:hover{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
  .row-use{background:var(--brand-soft);border-color:var(--brand-soft-border);color:var(--brand-ink)}
  .row-use:hover{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
  .row-use.is-current,.row-use.is-current:hover{
    background:var(--ok-bg);border-color:var(--ok-border);color:#fff;cursor:default;
  }

  .name-input{
    width:100%;min-width:0;border:1px solid var(--brand);border-radius:8px;background:var(--surface);color:var(--ink);
    font:600 var(--fs-title)/var(--lh-title) var(--font-display);padding:3px 6px;outline:none;
    box-shadow:0 0 0 3px var(--focus-halo);
  }

  /* ---------- 预览弹窗 ---------- */
  .overlay{
    position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;
    background:rgba(24,25,23,.48);
    visibility:hidden;opacity:0;pointer-events:none;
    transition:opacity .18s,visibility 0s .18s;
  }
  .overlay.open{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .18s,visibility 0s 0s}
  .dialog{
    width:min(1120px,96vw);max-height:92vh;display:flex;flex-direction:column;
    background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;
    box-shadow:0 40px 100px rgba(0,0,0,.34);overflow:hidden;
    transform:translateY(10px) scale(.985);transition:transform .2s cubic-bezier(.2,.8,.2,1);
  }
  .overlay.open .dialog{transform:none}
  .dlg-head{
    flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
    padding:18px 20px 14px;border-bottom:1px solid var(--line);
  }
  .dlg-title-row{display:flex;align-items:center;gap:6px}
  .dlg-actions{display:flex;align-items:center;gap:10px;flex:none}
  .dlg-title-row h2{margin:0;font:600 var(--fs-title)/var(--lh-title) var(--font-display);letter-spacing:-.01em}
  .dlg-meta{margin:7px 0 0;font:400 var(--fs-aux)/var(--lh-aux) var(--font-mono);color:var(--ink-2);letter-spacing:.01em}
  .dlg-head .icon-btn{margin-top:1px}
  .close-btn{
    width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--surface);
    color:var(--ink-2);display:grid;place-items:center;cursor:pointer;transition:background .12s,color .12s;
  }
  .close-btn:hover{background:var(--danger);border-color:var(--danger);color:#fff}
  .close-btn svg{width:11px;height:11px;stroke:currentColor;stroke-width:1.5;fill:none}

  .dlg-body{display:flex;flex:1;flex-direction:column;gap:10px;min-height:0;overflow:auto;padding:18px 20px 14px;background:var(--surface-2)}
  .desktop{
    position:relative;margin:0 auto;
    width:min(100%,calc((92vh - 266px) * var(--ar)));
    aspect-ratio:var(--ar);
    border:1px solid var(--line-strong);border-radius:10px;
    background-color:var(--desktop-bg);
    background-image:radial-gradient(var(--desktop-dot) 1px,transparent 1px);
    background-size:18px 18px;
    overflow:hidden;
    box-shadow:inset 0 0 0 1px var(--line);
  }
  .desktop .di{position:absolute;width:26px;height:26px}
  .desktop .tile{
    width:26px;height:26px;border-radius:6px;display:grid;place-items:center;
    color:#fff;font:600 var(--fs-icon)/1 var(--font-display);
    box-shadow:0 1px 2px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.22);
  }
  .desktop .dlabel{
    position:absolute;top:29px;left:50%;transform:translateX(-50%);width:80px;
    text-align:center;font:400 var(--fs-preview-label)/1.3 var(--font-text);color:var(--desktop-label);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 1px 0 var(--desktop-label-shadow);
  }
  .desktop .di:hover .tile{outline:2px solid var(--brand);outline-offset:1px}
  .dlg-foot{margin:0;text-align:right;font:400 var(--fs-aux)/var(--lh-aux) var(--font-mono);color:var(--ink-3);letter-spacing:.02em}

  .dlg-foot-bar{
    flex:none;display:flex;align-items:center;justify-content:flex-end;gap:12px;
    padding:12px 20px;border-top:1px solid var(--line);background:var(--surface);
  }
  .btn-danger-ghost,.btn-ghost,.btn-danger{
    height:32px;padding:0 12px;border-radius:8px;
    font:500 var(--fs-body)/1 var(--font-text);cursor:pointer;
  }
  .btn-danger-ghost{border:1px solid var(--danger-text);background:transparent;color:var(--danger-text);transition:background .14s,color .14s,border-color .14s}
  .btn-danger-ghost:hover{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn-ghost{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);transition:background .14s,border-color .14s,color .14s}
  .btn-ghost:hover{background:transparent;border-color:var(--ok);color:var(--ok)}
  .btn-danger{border:1px solid var(--danger);background:var(--danger);color:#fff;transition:background .14s,border-color .14s}
  .btn-danger:hover{background:#942017;border-color:#942017}
  .btn-danger:focus-visible{outline:2px solid #fff;outline-offset:-4px;box-shadow:0 0 0 2px var(--danger)}

  .confirm-overlay{
    position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:24px;
    background:rgba(16,20,28,.44);
    visibility:hidden;opacity:0;pointer-events:none;
    transition:opacity .16s,visibility 0s .16s;
  }
  .confirm-overlay.open{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .16s,visibility 0s 0s}
  .confirm-dialog{
    width:min(400px,92vw);padding:20px;
    background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;
    box-shadow:0 24px 64px rgba(16,20,28,.28);
  }
  .confirm-title{margin:0;font:600 var(--fs-title)/var(--lh-title) var(--font-display)}
  .confirm-text{margin:8px 0 0;font:400 var(--fs-body)/var(--lh-body) var(--font-text);color:var(--ink-2)}
  .confirm-text b{color:var(--ink);font-weight:600}
  .confirm-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

  /* ---------- 设置弹窗 ---------- */
  .settings-overlay{
    position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;padding:24px;
    background:rgba(16,20,28,.44);
    visibility:hidden;opacity:0;pointer-events:none;
    transition:opacity .16s,visibility 0s .16s;
  }
  .settings-overlay.open{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .16s,visibility 0s 0s}
  .settings-dialog{
    width:min(1000px,94vw);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;
    background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;
    box-shadow:0 24px 64px rgba(0,0,0,.3);
  }
  .settings-head{
    flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
    padding:20px 24px 16px;border-bottom:1px solid var(--line);
  }
  .settings-title{margin:0;font:600 var(--fs-title)/var(--lh-title) var(--font-display)}
  .settings-body{flex:1;min-height:0;overflow:auto}
  .settings-section{padding:18px 24px;border-bottom:1px solid var(--line)}
  .settings-section:last-child{border-bottom:0}
  .section-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .section-head h3{margin:0;font:600 var(--fs-title)/var(--lh-title) var(--font-display);color:var(--ink)}
  .section-head p{margin:0;font:400 var(--fs-aux)/var(--lh-aux) var(--font-text);color:var(--ink-3)}
  .soon{
    flex:none;padding:3px 7px;border-radius:999px;
    background:var(--brand-soft);color:var(--brand-ink);border:1px solid var(--brand-soft-border);
    font:500 var(--fs-aux)/1 var(--font-text);
  }
  .setting-row{display:flex;align-items:center;justify-content:space-between;gap:24px}
  .row-label{min-width:0}
  .row-label b{display:block;font:500 var(--fs-body)/var(--lh-body) var(--font-text);color:var(--ink)}
  .row-label small{display:block;margin-top:3px;font:400 var(--fs-aux)/var(--lh-aux) var(--font-text);color:var(--ink-3)}
  .row-control{display:flex;align-items:center;gap:10px;min-width:0}

  .placeholder-btn{
    min-height:calc(var(--fs-body) + 16px);padding:0 12px;border:1px solid var(--line-strong);border-radius:8px;
    background:var(--surface-2);color:var(--ink-2);display:inline-flex;align-items:center;
    font:500 var(--fs-body)/1 var(--font-text);cursor:default;
  }
  .placeholder-btn:disabled{opacity:1}
  .select-wrap{position:relative;display:inline-flex;align-items:center}
  .select-wrap select{
    appearance:none;-webkit-appearance:none;
    height:calc(var(--fs-body) + 18px);min-width:180px;padding:0 34px 0 12px;
    border:1px solid var(--line-strong);border-radius:8px;
    background:var(--surface-2);color:var(--ink);
    font:500 var(--fs-body)/1 var(--font-text);cursor:pointer;outline:none;
  }
  .select-wrap select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .select-wrap .chev{position:absolute;right:11px;pointer-events:none;width:12px;height:12px;stroke:var(--ink-2);stroke-width:1.5;fill:none}
  .path-value{
    max-width:340px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
    background:var(--surface-2);color:var(--ink-2);
    font:400 var(--fs-aux)/1.3 var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .font-options{display:inline-flex;padding:2px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2)}
  .font-opt{
    height:calc(var(--fs-body) + 12px);min-width:64px;padding:0 12px;border:0;border-radius:6px;background:transparent;
    color:var(--ink-2);font:500 var(--fs-body)/1 var(--font-text);cursor:pointer;
    transition:background .14s,color .14s;
  }
  .font-opt:hover{color:var(--ink)}
  .font-opt.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

  .storage-switch{
    position:relative;display:inline-flex;align-items:stretch;width:fit-content;max-width:100%;
    height:calc(var(--fs-body) + 20px);padding:2px;
    border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2);
  }
  .switch-thumb{
    position:absolute;top:2px;left:2px;
    width:0;height:calc(100% - 4px);
    border-radius:6px;background:var(--surface);
    box-shadow:0 1px 2px rgba(0,0,0,.08);
    pointer-events:none;transition:left .18s ease,width .18s ease;
  }
  .switch-opt{
    position:relative;z-index:1;flex:0 0 auto;height:100%;padding:0 14px;
    border:0;border-radius:6px;background:transparent;
    color:var(--ink-2);font:500 var(--fs-body)/1 var(--font-text);cursor:pointer;
    white-space:nowrap;transition:color .14s;
  }
  .switch-opt:hover,.switch-opt[aria-checked="true"]{color:var(--ink)}
  .storage-path{margin-top:14px}
  .storage-path-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .storage-path-label{font:500 var(--fs-body)/var(--lh-body) var(--font-text);color:var(--ink)}
  .storage-path-hint{font:400 var(--fs-aux)/var(--lh-aux) var(--font-text);color:var(--ink-3)}
  .storage-path-row{display:flex;align-items:center;gap:10px;margin-top:10px}
  .path-input{
    flex:1;min-width:0;height:calc(var(--fs-body) + 18px);padding:0 12px;
    border:1px solid var(--line-strong);border-radius:8px;
    background:var(--surface-2);color:var(--ink-2);
    font:500 var(--fs-aux)/1 var(--font-mono);outline:none;
  }
  .path-input:not([readonly]){background:var(--surface);color:var(--ink);cursor:text}
  .path-input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .storage-change[hidden]{display:none}

  .picker-overlay{
    position:fixed;inset:0;z-index:28;display:flex;align-items:center;justify-content:center;padding:24px;
    background:rgba(16,20,28,.44);
    visibility:hidden;opacity:0;pointer-events:none;
    transition:opacity .16s,visibility 0s .16s;
  }
  .picker-overlay.open{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .16s,visibility 0s 0s}
  .picker-dialog{
    width:min(520px,94vw);overflow:hidden;
    background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;
    box-shadow:0 24px 64px rgba(0,0,0,.3);
  }
  .picker-head{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
  .picker-title{margin:0;font:600 var(--fs-title)/var(--lh-title) var(--font-display)}
  .picker-path{
    margin:12px 20px 0;padding:8px 10px;border:1px dashed var(--line-strong);border-radius:8px;
    font:400 var(--fs-aux)/1.3 var(--font-mono);color:var(--ink-2);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .picker-list{
    margin:12px 20px 0;padding:4px;max-height:220px;overflow:auto;
    display:flex;flex-direction:column;gap:4px;
    border:1px solid var(--line);border-radius:8px;background:var(--surface-2);
  }
  .picker-item{
    width:100%;padding:10px 12px;border:0;border-radius:8px;background:transparent;
    color:var(--ink);font:400 var(--fs-body)/var(--lh-body) var(--font-mono);
    text-align:left;cursor:pointer;transition:background .12s,color .12s;
  }
  .picker-item:hover{background:var(--surface)}
  .picker-item.selected{background:var(--brand-soft);color:var(--brand-ink);font-weight:500}
  .picker-actions{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px 18px}

  .theme-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .theme-card{
    display:flex;flex-direction:column;gap:10px;width:100%;padding:12px;
    border:1px solid var(--line);border-radius:8px;background:var(--surface);
    text-align:left;cursor:pointer;transition:border-color .14s,background .14s;
  }
  .theme-card:hover{border-color:var(--line-strong);background:var(--surface-2)}
  .theme-card[aria-checked="true"]{border-color:var(--brand);background:var(--surface)}
  .theme-swatch{position:relative;width:100%;height:72px;border-radius:8px;border:1px solid var(--line);overflow:hidden}
  .theme-swatch i{position:absolute;left:12px;right:12px;top:12px;height:16px;border-radius:4px;display:block}
  .theme-swatch em{position:absolute;left:12px;right:12px;bottom:12px;height:16px;border-radius:4px;display:block}
  .theme-swatch.light{background:#E8EDF4}
  .theme-swatch.light i{background:#FFFFFF;border:1px solid #C9DAF2}
  .theme-swatch.light em{background:#1A5FBF}
  .theme-swatch.dark{background:#0C0C0E;border-color:#33332E}
  .theme-swatch.dark i{background:#1A1A1C;border:1px solid #48483F}
  .theme-swatch.dark em{background:#E8B53A}
  .theme-meta{display:flex;align-items:center;gap:10px}
  .theme-info{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
  .theme-info b{font:600 var(--fs-body)/var(--lh-body) var(--font-text);color:var(--ink)}
  .theme-info small{font:400 var(--fs-aux)/var(--lh-aux) var(--font-text);color:var(--ink-3)}
  .theme-check{
    width:calc(var(--fs-aux) + 8px);height:calc(var(--fs-aux) + 8px);border-radius:50%;display:grid;place-items:center;flex:none;
    border:1px solid var(--line-strong);color:transparent;
    font:600 var(--fs-aux)/1 var(--font-text);
  }
  .theme-card[aria-checked="true"] .theme-check{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

  /* ---------- 浮层 ---------- */
  .tip{
    position:fixed;z-index:40;padding:5px 8px;border-radius:6px;background:#1B1C1A;color:#F3F1EC;
    font:400 var(--fs-aux)/var(--lh-aux) var(--font-mono);pointer-events:none;white-space:nowrap;
    opacity:0;transform:translateY(2px);transition:opacity .12s;
    box-shadow:0 6px 18px rgba(0,0,0,.24);
  }
  .tip.show{opacity:1;transform:none}
  .toast{
    position:fixed;left:50%;bottom:30px;z-index:50;transform:translate(-50%,8px);
    background:#1F211E;color:#F5F3ED;padding:10px 16px;border-radius:9px;
    font:500 var(--fs-body)/var(--lh-body) var(--font-text);box-shadow:0 12px 30px rgba(0,0,0,.28);
    opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .page-note{font:400 var(--fs-aux)/1.2 var(--font-mono);color:var(--ink-3);letter-spacing:.04em}

  @media (max-width:900px){
    body{padding:0;background:var(--chrome);gap:0}
    .app{width:100vw;height:100vh;border:0;border-radius:0;box-shadow:none}
    .page-note{display:none}
    .content.grid{grid-template-columns:1fr}
    .list-head,.row{grid-template-columns:76px minmax(90px,1fr) 96px 56px calc(var(--fs-body) * 9 + 52px)}
    .list-head span:nth-child(4){display:none}
    .cell-res{display:none}
  }

  @media (max-width:720px){
    .theme-options{grid-template-columns:1fr}
    .setting-row{flex-direction:column;align-items:flex-start;gap:10px}
    .path-value{max-width:100%}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
      scroll-behavior:auto !important;
    }
    .card:hover{transform:none}
  }
</style>
</head>
<body>

<main class="app">
  <header class="titlebar">
    <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="app-title" data-i18n="app.title">桌面图标布局备份管理</span>
    <span class="app-sub">Desktop Layout</span>
    <div class="titlebar-actions">
      <button class="icon-btn" id="settingsBtn" aria-label="设置" title="设置" data-i18n-aria="settings.title" data-i18n-title="settings.title">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
    <div class="win-controls" aria-hidden="true">
      <button title="最小化" tabindex="-1" data-i18n-title="win.minimize"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5h8"/></svg></button>
      <button title="最大化" tabindex="-1" data-i18n-title="win.maximize"><svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1.5" y="1.5" width="7" height="7"/></svg></button>
      <button class="close" title="关闭" tabindex="-1" data-i18n-title="win.close"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg></button>
    </div>
  </header>

  <section class="toolbar">
    <div>
      <div class="h-row">
        <h1 data-i18n="toolbar.heading">备份</h1>
        <span class="count" id="backupCount">3</span>
      </div>
      <p class="sub"><span data-i18n="toolbar.lastBackupPrefix">最近备份于</span> <b id="lastBackup">—</b></p>
    </div>
    <div class="actions">
      <button class="btn-primary" id="backupBtn">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-label" data-i18n="toolbar.backup">备份当前布局</span>
      </button>

      <div class="pill-group" role="group" aria-label="排序" data-i18n-aria="sort.label">
        <span class="group-label" aria-hidden="true" data-i18n="sort.label">排序</span>
        <button class="dd-trigger" id="sortTrigger" aria-expanded="false" aria-haspopup="listbox">
          <span class="dd-value" id="sortValue">按备份时间</span>
          <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>
        </button>
        <button class="dir-btn" id="sortDir" title="降序" aria-label="当前为降序，点击切换为升序">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path id="sortArrow" d="M12 5v14M19 12l-7 7-7-7"/></svg>
        </button>
      </div>
      <span class="sr-only" id="sortStatus" role="status" aria-live="polite"></span>

      <div class="seg" role="group" aria-label="视图切换" data-i18n-aria="view.groupAria">
        <button data-mode="grid" aria-pressed="true" aria-label="网格视图" title="网格视图" data-i18n-aria="view.grid" data-i18n-title="view.grid">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5"/><rect x="9" y="2" width="5" height="5"/><rect x="2" y="9" width="5" height="5"/><rect x="9" y="9" width="5" height="5"/></svg>
          <span data-i18n="view.grid">网格</span>
        </button>
        <button data-mode="list" aria-pressed="false" aria-label="列表视图" title="列表视图" data-i18n-aria="view.list" data-i18n-title="view.list">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h1M5 3h9M2 8h1M5 8h9M2 13h1M5 13h9"/></svg>
          <span data-i18n="view.list">列表</span>
        </button>
      </div>
    </div>
  </section>

  <section class="content grid" id="content" aria-label="备份列表" data-i18n-aria="list.aria"></section>
</main>

<p class="page-note" data-i18n="page.note">静态 UI 样板 · 数据为模拟 · 备份 / 视图切换 / 预览 / 重命名均可交互</p>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="pvName" aria-describedby="pvMeta">
    <header class="dlg-head">
      <div>
        <div class="dlg-title-row">
          <h2 id="pvName">工作布局</h2>
          <button class="icon-btn" id="pvRename" aria-label="更改名称" title="更改名称" data-i18n-aria="rename" data-i18n-title="rename">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.8 2.6l2.6 2.6L5.6 13H3v-2.6z"/></svg>
          </button>
        </div>
        <p class="dlg-meta" id="pvMeta"></p>
      </div>
      <div class="dlg-actions">
        <button class="close-btn" id="pvClose" aria-label="关闭预览" data-i18n-aria="preview.close">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"/></svg>
        </button>
      </div>
    </header>
    <div class="dlg-body">
      <div class="desktop" id="pvDesktop"></div>
      <p class="dlg-foot" data-i18n="preview.hint">按原分辨率等比缩放 · 悬停查看图标坐标 · Esc 关闭</p>
    </div>
    <footer class="dlg-foot-bar">
      <button class="btn-danger-ghost" id="pvDelete" data-i18n="preview.delete">删除当前布局配置</button>
      <button class="btn-primary btn-sm" id="pvUse">使用布局</button>
    </footer>
  </div>
</div>

<div class="settings-overlay" id="settingsOverlay" aria-hidden="true">
  <div class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">

    'Krita','Blender','Unreal Engine','Unity','Godot','VS Code','Rider','WebStorm',
    'Figma','Photoshop','After Effects','Premiere Pro','DaVinci Resolve','Steam','Epic Games',
    'LM Studio','Docker Desktop','Postman','Git Bash','Node.js','Python 3.12','Ollama','ComfyUI',

    '待整理','回收站','此电脑','网络','控制面板'
  ];
  var EXTRA_TYPES = ['素材','参考','文档','插件','脚本','贴图','模型','备份','测试','归档'];

  function buildNames(count){
    var out = [];
    for (var i = 0; i < count; i++){
      if (i < BASE_NAMES.length){
        out.push(BASE_NAMES[i]);
      } else {
        var k = i - BASE_NAMES.length;
        var n = String(Math.floor(k / EXTRA_TYPES.length) + 1);
        out.push(EXTRA_TYPES[k % EXTRA_TYPES.length] + ' ' + (n.length < 2 ? '0' + n : n));
      }
    }
    return out;
  }

  function makeIcons(count, w, h, rightGroup){
    var names = buildNames(count);
    var pw = w >= 2400 ? 112 : 96;
    var ph = w >= 2400 ? 136 : 110;
    var rows = Math.floor((h - 60) / ph);
    var icons = names.map(function(name, i){
      return {
        index: i,
        name: name,
        x: 26 + Math.floor(i / rows) * pw,
        y: 26 + (i % rows) * ph
      };
    });
    if (rightGroup){
      var n = Math.min(rightGroup, icons.length);
      for (var k = 0; k < n; k++){
        var it = icons[icons.length - n + k];
        it.x = w - 132;
        it.y = 44 + k * ph;
      }
    }
    return icons;
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){

  function pad(n){ return n < 10 ? '0' + n : String(n); }
  function fmtTime(iso){

  function colorFor(name){
    var h = 0;
    for (var i = 0; i < name.length; i++){ h = (h * 31 + name.charCodeAt(i)) >>> 0; }
    return COLORS[h % COLORS.length];
  }
  function initials(name){
    if (/^[\u4e00-\u9fa5]/.test(name)){ return name.slice(0, 1); }
    var parts = name.trim().split(/\s+/);
    var a = parts[0] ? parts[0][0] : '';
    var b = parts[1] ? parts[1][0] : '';
    return (a + b).toUpperCase();
  }

  function closeSortMenu(restoreFocus){
    if (!sortMenu) return;
    sortMenu.remove();

  function openSortMenu(){
    if (sortMenu) return;
    sortTrigger.setAttribute('aria-expanded', 'true');

    sortMask = document.createElement('div');
    sortMask.className = 'dd-mask';
    sortMask.addEventListener('click', function(){ closeSortMenu(true); });
    document.body.appendChild(sortMask);

    var r = sortTrigger.getBoundingClientRect();
    sortMenu = document.createElement('div');
    sortMenu.className = 'dd-menu';
    sortMenu.setAttribute('role', 'listbox');
    sortMenu.setAttribute('aria-label', '排序方式');
    var left = Math.max(8, Math.min(r.left, window.innerWidth - 176));
    sortMenu.style.top = (r.bottom + 4) + 'px';
    sortMenu.style.left = left + 'px';

    SORT_OPTIONS.forEach(function(o){
      var item = document.createElement('button');
      item.type = 'button';
      item.className = 'dd-item' + (o.value === sortState.key ? ' selected' : '');
      item.setAttribute('role', 'option');
      item.setAttribute('aria-selected', o.value === sortState.key ? 'true' : 'false');
      item.innerHTML = '<span>' + esc(t(o.labelKey)) + '</span><span class="tick" aria-hidden="true">✓</span>';
      item.addEventListener('click', function(){
        sortState.key = o.value;
        closeSortMenu(true);
        updateSortUI();
        renderContent();
      });
      sortMenu.appendChild(item);
    });
    document.body.appendChild(sortMenu);

    sortMenu.addEventListener('keydown', function(e){
      var items = Array.prototype.slice.call(sortMenu.querySelectorAll('.dd-item'));
      var idx = items.indexOf(document.activeElement);
      if (e.key === 'ArrowDown'){ e.preventDefault(); items[Math.min(idx + 1, items.length - 1)].focus(); }
      else if (e.key === 'ArrowUp'){ e.preventDefault(); items[Math.max(idx - 1, 0)].focus(); }
      else if (e.key === 'Home'){ e.preventDefault(); items[0].focus(); }
      else if (e.key === 'End'){ e.preventDefault(); items[items.length - 1].focus(); }
      else if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); closeSortMenu(true); }
    });

    var selected = sortMenu.querySelector('.dd-item.selected') || sortMenu.querySelector('.dd-item');
    if (selected) selected.focus();
  }

    input.addEventListener('keydown', function(ev){
      ev.stopPropagation();
      if (ev.key === 'Enter'){ ev.preventDefault(); finish(true); }

      return '<div class="di" data-name="' + esc(ic.name) + '" data-x="' + ic.x + '" data-y="' + ic.y + '" style="left:' + l + '%;top:' + t + '%">' +

  function t(key, params){
    var dict = I18N[currentLang] || I18N['zh-CN'];
    var s = dict[key];
    if (s == null) s = I18N['zh-CN'][key];
    if (s == null) s = key;
    if (params){
      for (var k in params){
        if (Object.prototype.hasOwnProperty.call(params, k)){
          s = s.split('{' + k + '}').join(String(params[k]));
        }
      }
    }
    return s;
  }

  function applyLanguage(lang, silent){
    var found = false;
    for (var i = 0; i < LANGUAGES.length; i++){
      if (LANGUAGES[i].value === lang){ found = true; break; }
    }
    currentLang = found ? lang : 'zh-CN';

    languageSelect.value = currentLang;

  function applyFontSize(size, silent){
    var allowed = ['small', 'normal', 'large', 'xlarge'];

    document.documentElement.setAttribute('data-font-size', v);
    try { localStorage.setItem('ui.fontSize', v); } catch (err) {}
    var btns = fontOptions.querySelectorAll('.font-opt');
    for (var i = 0; i < btns.length; i++){

  function storagePathFor(mode){

    if (keys.indexOf(e.key) === -1) return;
    e.preventDefault();
    var cards = Array.prototype.slice.call(themeOptions.querySelectorAll('.theme-card'));
    var idx = cards.indexOf(document.activeElement);
    if (idx === -1) return;
    var step = (e.key === 'ArrowDown' || e.key === 'ArrowRight') ? 1 : -1;
    var nextCard = cards[(idx + step + cards.length) % cards.length];
    nextCard.focus();
    nextCard.click();
  });

  pvDesktop.addEventListener('mouseover', function(e){
    var di = e.target.closest('.di');
    if (!di) return;
    tip.textContent = di.dataset.name + ' · (' + di.dataset.x + ', ' + di.dataset.y + ')';
    tip.classList.add('show');
  });
  pvDesktop.addEventListener('mousemove', function(e){
    if (!tip.classList.contains('show')) return;
    var x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 12);
    var y = Math.min(e.clientY + 16, window.innerHeight - tip.offsetHeight - 12);
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  });
  pvDesktop.addEventListener('mouseout', function(e){
    var di = e.target.closest('.di');
    if (di && !di.contains(e.relatedTarget)) tip.classList.remove('show');
  });

  var savedLang = 'zh-CN';
  try { savedLang = localStorage.getItem('ui.lang') || 'zh-CN'; } catch (err) {}

  var savedMode = 'documents', savedCustom = '';
  try {
    savedMode = localStorage.getItem('ui.storageMode') || 'documents';
    savedCustom = localStorage.getItem('ui.customPath') || '';
  } catch (err) {}
  if (savedCustom) storageState.custom = savedCustom;
  if (['documents', 'app', 'custom'].indexOf(savedMode) !== -1) storageState.mode = savedMode;

  var savedFont = 'normal';
  try { savedFont = localStorage.getItem('ui.fontSize') || 'normal'; } catch (err) {}
  applyFontSize(savedFont, true);

  var savedTheme = 'light';
  try { savedTheme = localStorage.getItem('ui.theme') || 'light'; } catch (err) {}
  applyTheme(savedTheme, true);
  applyLanguage(savedLang, true);
})();
</script>
</body>
</html>
